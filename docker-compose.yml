# Full local stack: API, UI, vector store and database.
#
#   cp .env.example .env      # set OPENAI_API_KEY and JWT_SECRET_KEY
#   docker compose up --build
#
# The API waits for Qdrant and MongoDB to report healthy before starting, so
# it never boots into its non-durable fallbacks by accident.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      QDRANT_URL: http://qdrant:6333
      MONGODB_URL: mongodb://mongo:27017
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      qdrant:
        condition: service_healthy
      mongo:
        condition: service_healthy

  ui:
    build: .
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      # Present only to satisfy startup validation; the UI calls the API.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      API_BASE_URL: http://api:8000
    command:
      - streamlit
      - run
      - streamlit_app/home.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    depends_on:
      - api

volumes:
  qdrant_data:
  mongo_data:
