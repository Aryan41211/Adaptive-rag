[pytest]
testpaths = tests
# Without this the package only imports when pytest is invoked as
# `python -m pytest`, which happens to put the current directory on sys.path.
# Bare `pytest` - what CI runs, and what anyone types after activating a venv -
# leaves it off, so every `from src...` import in conftest fails at collection
# with "No module named 'src'".
pythonpath = .
asyncio_mode = auto
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
