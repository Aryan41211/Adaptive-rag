# ---------------------------------------------------------------------------
# Render blueprint for Adaptive RAG.
#
# Two free-tier web services and no committed secrets: every credential below
# is either generated by Render (JWT_SECRET_KEY) or filled in by hand once the
# blueprint is created (GEMINI_API_KEY, QDRANT_*, MONGODB_URL, API_BASE_URL).
# Any variable with `sync: false` is NOT written back into the repo - it is
# stored only in the service dashboard, which is the correct place for keys.
#
# To use: "New > Blueprint" and select this repo, or from the Render CLI:
#   render blueprint launch --repo https://github.com/Aryan41211/Adaptive-rag
#
# The credentials behind the `sync: false` entries live in external free tiers:
#   - Google AI Studio (Gemini): https://aistudio.google.com/apikey
#   - Qdrant Cloud free tier:    https://cloud.qdrant.io
#   - MongoDB Atlas free tier:   https://www.mongodb.com/atlas
# ---------------------------------------------------------------------------

services:
  - type: web
    name: adaptive-rag-api
    runtime: docker
    repo: https://github.com/Aryan41211/Adaptive-rag
    region: oregon
    plan: free
    branch: main
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # The image tag already sets this; Render needs to know it too, because a
      # mismatched value silently changes which interpreter the container runs.
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Providers: gemini is the free-tier default; openai/ollama also valid.
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_API_KEY
        sync: false
      # Generated once by Render and stored in the dashboard. The app refuses
      # to boot without a real JWT secret, so this keeps the blueprint usable
      # without asking you to paste a secret twice.
      - key: JWT_SECRET_KEY
        generateValue: true
      # Qdrant Cloud free tier.
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: adaptive_rag_documents
      # MongoDB Atlas free tier. Format:
      #   mongodb+srv://USER:PASSWORD@CLUSTER.mongodb.net/?retryWrites=true&w=majority
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: adaptive_rag
      # The graph routes questions to a web_search node. Without this key that
      # node answers "web search is not configured on this deployment" to
      # anyone asking anything current. sync:false makes Render prompt for it,
      # so the choice is visible at deploy time; leaving it blank degrades to
      # the same message rather than failing.
      - key: TAVILY_API_KEY
        sync: false
      # Hardening for the public endpoint; API docs would reveal the schema.
      - key: ENABLE_API_DOCS
        value: "false"
      # Without this the API answers any Host header, and TrustedHostMiddleware
      # is not installed at all (the default is "*"). Set this to the custom
      # domain too if you attach one; the generated hostname is listed here so
      # the blueprint is not created in the open state.
      - key: ALLOWED_HOSTS
        value: adaptive-rag-api.onrender.com
      # Render terminates TLS itself, so there is no Caddy edge here to answer
      # 404 for /metrics/prometheus. This token is what keeps the route,
      # latency and model-spend internals private. Scraper:
      #   authorization: credentials: <token>
      - key: METRICS_TOKEN
        generateValue: true
      - key: LOG_LEVEL
        value: WARNING

  - type: web
    name: adaptive-rag-ui
    runtime: python
    repo: https://github.com/Aryan41211/Adaptive-rag
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.lock.txt
    startCommand: streamlit run streamlit_app/home.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      # `runtime: python` has no image to inherit an interpreter from, and
      # requirements.lock.txt was resolved by pip-compile under a single 3.12
      # with no markers to fall back on. Without this Render installs it under
      # whatever its current default happens to be.
      - key: PYTHON_VERSION
        value: "3.12.8"
      # The API is deployed once. Then set this to the live API URL
      # (https://adaptive-rag-api.onrender.com) so the UI can reach it.
      - key: API_BASE_URL
        sync: false