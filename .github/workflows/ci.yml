name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The live probes exist to catch provider-side breakage an offline suite
  # structurally cannot see: a retired model, a changed response shape, a
  # revoked key. Weekly is often enough for that and keeps free-tier quota
  # use negligible. 04:23 UTC, off the hour so this does not join every other
  # scheduled workflow at :00.
  schedule:
    - cron: "23 4 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite never calls a real provider; these only satisfy startup
  # validation, which is deliberately strict about placeholder values.
  OPENAI_API_KEY: sk-ci-not-a-real-key
  JWT_SECRET_KEY: ci-secret-key-long-enough-for-validation-0123456789
  MONGODB_URL: ""
  QDRANT_URL: ""
  LOG_LEVEL: WARNING

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.14.5 packaging
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      # The lock file is what the image installs; requirements.txt is what the
      # project claims to depend on. Drift between them is invisible until a
      # deployed image behaves differently from a developer's virtualenv.
      - name: Lock file matches requirements
        run: python scripts/check_lock.py

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest --cov=src --cov-report=term --cov-report=xml -q
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: adaptive-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 \
            -e OPENAI_API_KEY="$OPENAI_API_KEY" \
            -e JWT_SECRET_KEY="$JWT_SECRET_KEY" \
            adaptive-rag:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/healthz
          curl -sf http://127.0.0.1:8000/readyz
          docker logs api
      # The UI runs the same image with a different command. Its healthcheck
      # is overridden in docker-compose.yml because the image's own probe
      # targets the API port; verify the endpoint that override relies on.
      - name: Smoke test the image as the UI
        run: |
          docker run -d --name ui -p 8501:8501 \
            -e OPENAI_API_KEY="$OPENAI_API_KEY" \
            -e JWT_SECRET_KEY="$JWT_SECRET_KEY" \
            adaptive-rag:ci \
            streamlit run streamlit_app/home.py \
              --server.port=8501 --server.address=0.0.0.0 --server.headless=true
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8501/_stcore/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8501/_stcore/health
          docker logs ui

  live-tests:
    name: Live provider probes
    runs-on: ubuntu-latest
    # Deliberately not on pull_request. Forks cannot read repository secrets,
    # so every probe would skip and report a green run that proved nothing -
    # and a workflow that runs on pull_request_target can be used to exfiltrate
    # a secret. Scheduled plus manual so the probes still catch provider
    # breakage that an offline suite structurally cannot.
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      # Satisfies the same startup validation as the offline jobs. The probes
      # use GEMINI_API_KEY from repository secrets instead.
      OPENAI_API_KEY: sk-ci-not-a-real-key
      JWT_SECRET_KEY: ci-secret-key-long-enough-for-validation-0123456789
      MONGODB_URL: ""
      QDRANT_URL: ""
      LOG_LEVEL: WARNING
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      # With no GEMINI_API_KEY secret configured these skip rather than fail,
      # which is why the job stays green for anyone who forks the repository.
      # A run that reports only skips is visible in the log, so silence is not
      # mistaken for a passing provider check.
      - name: Run the live Gemini probes
        run: pytest tests_live -v -rs

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    # Only ever publishes a commit that passed lint, tests and the image
    # smoke test. Pull requests build but never push.
    needs: [lint, test, docker]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      # GITHUB_TOKEN is enough for GitHub's own registry, so publishing needs
      # no configured secrets. To publish elsewhere, change the registry and
      # supply that registry's credentials as repository secrets instead.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercased by the action: registry paths reject uppercase, and
          # GitHub owner names may contain it.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
